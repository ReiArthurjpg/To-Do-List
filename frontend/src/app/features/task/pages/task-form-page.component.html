<mat-card><mat-card-header><mat-card-title>{{isEdit ? 'Editar tarefa' : 'Nova tarefa'}}</mat-card-title></mat-card-header><mat-card-content><form [formGroup]="form" (ngSubmit)="submit()" class="form"><mat-form-field appearance="outline"><mat-label>Título</mat-label><input matInput formControlName="title" maxlength="120"><mat-error>Informe um título válido.</mat-error></mat-form-field><mat-form-field appearance="outline"><mat-label>Descrição</mat-label><textarea matInput formControlName="description" rows="5" maxlength="1000"></textarea></mat-form-field><mat-form-field appearance="outline"><mat-label>Status</mat-label><mat-select formControlName="status">@for (status of statusOptions; track status) { <mat-option [value]="status">{{status}}</mat-option> }</mat-select></mat-form-field><div class="actions"><a mat-button routerLink="/">Cancelar</a><button mat-flat-button color="primary" type="submit">Salvar</button></div></form></mat-card-content></mat-card>
