# ─────────────────────────────────────────────────────────────
# TaskFlow — Docker Compose
# ─────────────────────────────────────────────────────────────
# Usage:
#   docker-compose up -d          → start all services
#   docker-compose up -d backend  → start only backend + dependencies
#   docker-compose logs -f        → follow logs
#   docker-compose down -v        → remove containers + volumes
# ─────────────────────────────────────────────────────────────

services:

  # ── MySQL Database ─────────────────────────────────────────
  mysql:
    image: mysql:8.4
    container_name: todo-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE:      todolist
      MYSQL_USER:          todo
      MYSQL_PASSWORD:      todo
      MYSQL_ROOT_PASSWORD: root
      TZ:                  America/Sao_Paulo
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - todo-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Spring Boot Backend ────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: todo-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL:      jdbc:mysql://mysql:3306/todolist?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: todo
      DB_PASSWORD: todo
      TZ:          America/Sao_Paulo
    ports:
      - "8080:8080"
    networks:
      - todo-network
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/actuator/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Angular Frontend (Nginx) ───────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: todo-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    networks:
      - todo-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── phpMyAdmin (Database UI) ───────────────────────────────
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: todo-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST:     mysql
      PMA_PORT:     3306
      PMA_USER:     root
      PMA_PASSWORD: root
      UPLOAD_LIMIT: 64M
    ports:
      - "8181:80"
    networks:
      - todo-network
    depends_on:
      mysql:
        condition: service_healthy

# ── Networks ───────────────────────────────────────────────
networks:
  todo-network:
    driver: bridge

# ── Volumes ────────────────────────────────────────────────
volumes:
  mysql_data:
    driver: local
