services:
  mysql:
    image: mysql:8.4
    container_name: todo-mysql
    environment:
      MYSQL_DATABASE: todolist
      MYSQL_USER: todo
      MYSQL_PASSWORD: todo
      MYSQL_ROOT_PASSWORD: root
    ports: ["3306:3306"]
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    container_name: todo-backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:mysql://mysql:3306/todolist?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: todo
      DB_PASSWORD: todo
    ports: ["8080:8080"]
    depends_on:
      mysql:
        condition: service_healthy
  frontend:
    build: ./frontend
    container_name: todo-frontend
    ports: ["4200:80"]
    depends_on: [backend]
volumes:
  mysql_data:
